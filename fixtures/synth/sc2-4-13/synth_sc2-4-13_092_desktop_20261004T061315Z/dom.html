<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus appearance</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { width: 1440px; min-height: 900px; position: relative; background: #FFFFFF; color: #111; }
  header.site {
    position: absolute; top: 0; left: 0; width: 100%;
    height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB;
    padding: 20px 32px; z-index: 10;
    font-weight: 600; color: #1F2937;
  }
  main.content { position: relative; padding: 96px 48px 48px 48px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB;
    border-radius: 8px; padding: 24px; margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px 0; font-size: 24px; color: #111827; }
  p  { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; color: #1F2937; }
  #confirm:focus { outline: 2px solid #949494; outline-offset: 2px; }
</style>
</head>
<body>
<header class="site">Synthetic Test Corpus — page synth_2.4.13_002</header>
<main class="content">

    <div class="card" style="background:#FFFFFF;">
      <h1>Confirm your action</h1>
      <p>Please review the summary below and confirm.</p>
      <button id="confirm" autofocus="" data-test-el="e-1" style="position:absolute; left:160px; top:260px;
               width:220px; height:48px;
               background:#FFFFFF; color:#111827;
               border:1px solid #D1D5DB; border-radius:6px;
               font-size:15px; font-weight:600; cursor:pointer;">
        Confirm
      </button>
    </div>
    
</main>


</body></html>
