[project]
name = "wcag-auditor-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "auditor",
  "fastapi[standard]==0.141.*",
  "uvicorn",
  "sse-starlette",
  "sqlalchemy>=2.0",
  "alembic",
  "python-multipart",
  "pypdf>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
