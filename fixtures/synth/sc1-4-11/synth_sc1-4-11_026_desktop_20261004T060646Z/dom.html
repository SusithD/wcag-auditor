<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Non-text contrast</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { width: 1440px; min-height: 900px; position: relative; background: #FFFFFF; color: #111; }
  header.site {
    position: absolute; top: 0; left: 0; width: 100%;
    height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB;
    padding: 20px 32px; z-index: 10;
    font-weight: 600; color: #1F2937;
  }
  main.content { position: relative; padding: 96px 48px 48px 48px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB;
    border-radius: 8px; padding: 24px; margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px 0; font-size: 24px; color: #111827; }
  p  { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; color: #1F2937; }
  
</style>
</head>
<body>
<header class="site">Synthetic Test Corpus — page synth_1.4.11_001</header>
<main class="content">

    <div class="card" style="background: #FFFFFF;">
      <h1>Contact us</h1>
      <p>We usually reply within one working day.</p>
    </div>
    <label for="name" style="position:absolute; left:80px; top:200px; font-size:12px; color:#374151;">Name</label>
    <input id="name" type="text" data-test-el="e-1" style="position: absolute; left: 80px; top: 220px; width: 320px; height: 40px; border: 1px solid rgb(152, 152, 152); border-radius: 4px; padding: 8px; background: rgb(255, 255, 255); font-size: 14px;">
    <label for="email" style="position:absolute; left:80px; top:276px; font-size:12px; color:#374151;">Email</label>
    <input id="email" type="email" data-test-el="e-2" style="position: absolute; left: 80px; top: 296px; width: 320px; height: 40px; border: 1px solid rgb(152, 152, 152); border-radius: 4px; padding: 8px; background: rgb(255, 255, 255); font-size: 14px;">
    
</main>


</body></html>
