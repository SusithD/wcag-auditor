[project]
name = "auditor"
version = "0.1.0"
description = "ML-assisted WCAG 2.2 auditor for web UI screenshots"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "typer>=0.12",
  "rich",
  "playwright==1.63.0",
  "pillow>=12",
  "numpy",
  "scipy>=1.18.1",
  "statsmodels>=0.15.0",
]

[project.scripts]
auditor = "auditor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditor"]
