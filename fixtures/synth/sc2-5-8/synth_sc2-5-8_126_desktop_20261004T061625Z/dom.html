<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target size</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { width: 1440px; min-height: 900px; position: relative; background: #FFFFFF; color: #111; }
  header.site {
    position: absolute; top: 0; left: 0; width: 100%;
    height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB;
    padding: 20px 32px; z-index: 10;
    font-weight: 600; color: #1F2937;
  }
  main.content { position: relative; padding: 96px 48px 48px 48px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB;
    border-radius: 8px; padding: 24px; margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px 0; font-size: 24px; color: #111827; }
  p  { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; color: #1F2937; }
  
</style>
</head>
<body>
<header class="site">Synthetic Test Corpus — page synth_2.5.8_001</header>
<main class="content">

    <div class="card" style="background:#FFFFFF;">
      <h1>Toolbar controls</h1>
      <p>Icon-only buttons in a small toolbar.</p>
    </div>
    <div style="position:absolute; left:120px; top:240px;">
        <button title="Bold" data-test-el="e-1" style="position:absolute; left:0px; top:0; width:22px; height:22px; padding:0; border:1px solid #D1D5DB; background:#FFFFFF;">B</button>
        <button title="Italic" data-test-el="e-2" style="position:absolute; left:22px; top:0; width:22px; height:22px; padding:0; border:1px solid #D1D5DB; background:#FFFFFF;">I</button>
        <button title="Underline" data-test-el="e-3" style="position:absolute; left:44px; top:0; width:22px; height:22px; padding:0; border:1px solid #D1D5DB; background:#FFFFFF;">U</button>
        <button title="Link" data-test-el="e-4" style="position:absolute; left:66px; top:0; width:22px; height:22px; padding:0; border:1px solid #D1D5DB; background:#FFFFFF;">🔗</button>
    </div>
    
</main>


</body></html>
