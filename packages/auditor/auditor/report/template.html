<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa; --surface: #ffffff; --muted: #f4f4f5; --border: #e4e4e7;
  --text: #18181b; --text-muted: #52525b; --accent: #2563eb;
  --sev-critical: #b91c1c; --sev-serious: #b45309; --sev-minor: #1d4ed8; --sev-needs-review: #52525b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b; --surface: #18181b; --muted: #27272a; --border: #52525b;
    --text: #fafafa; --text-muted: #a1a1aa; --accent: #60a5fa;
    --sev-critical: #fca5a5; --sev-serious: #fcd34d; --sev-minor: #93c5fd; --sev-needs-review: #a1a1aa;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/20px system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.finding a, nav a, .skip { display: inline-block; min-height: 24px; min-width: 24px; padding: 2px 0; }
.finding li, nav li { margin: 2px 0; }
a:focus-visible, pre:focus-visible, .scroll:focus-visible, main:focus-visible, #findings:focus-visible, #coverage-region:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; border: 1px solid var(--border); }
.skip:focus { left: 8px; z-index: 1; } .skip + .skip:focus { left: 160px; }
header, main, footer { max-width: 1040px; margin: 0 auto; padding: 16px 24px; }
header { border-bottom: 1px solid var(--border); }
h1 { font-size: 24px; line-height: 32px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; line-height: 28px; margin: 32px 0 8px; letter-spacing: -0.01em; }
h3 { font-size: 16px; line-height: 24px; margin: 0 0 4px; }
h4 { margin: 16px 0 4px; font-size: 14px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--text-muted); }
.chip[class*="sev-"] { font-weight: 600; }
.sev-critical { color: var(--sev-critical); } .sev-serious { color: var(--sev-serious); }
.sev-minor { color: var(--sev-minor); } .sev-needs-review { color: var(--sev-needs-review); }
.summary { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; margin: 8px 0; }
.finding { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 12px 0; }
.evidence { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 8px 0; }
.evidence dt { color: var(--text-muted); font-size: 12px; } .evidence dd { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
pre { background: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; overflow: auto; }
img.crop { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
.scroll { overflow-x: auto; }
td, th { overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; background: var(--surface); }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
caption { text-align: left; color: var(--text-muted); padding: 4px 0; }
.overview .shot { position: relative; max-width: 100%; border: 1px solid var(--border); }
.overview img { display: block; max-width: 100%; height: auto; }
.overview svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.box { fill: none; stroke: currentColor; stroke-width: 2px; vector-effect: non-scaling-stroke; }
.box.sev-needs-review { stroke-width: 1.5px; }
.halo { fill: none; stroke: #fff; stroke-width: 4px; vector-effect: non-scaling-stroke; }
.tag { font: 600 11px ui-monospace, Menlo, monospace; fill: #000; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.box.sev-critical { stroke: var(--sev-critical); } .box.sev-serious { stroke: var(--sev-serious); }
.box.sev-minor { stroke: var(--sev-minor); } .box.sev-needs-review { stroke: var(--sev-needs-review); }
figcaption { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
nav ul { columns: 2; padding-left: 20px; }
@media (max-width: 640px) { nav ul { columns: 1; } header, main, footer { padding: 12px 16px; } }
@media print {
  :root { --bg: #fff; --surface: #fff; --muted: #f4f4f5; --border: #71717a; --text: #000; --text-muted: #3f3f46; --accent: #1d4ed8;
    --sev-critical: #b91c1c; --sev-serious: #b45309; --sev-minor: #1d4ed8; --sev-needs-review: #52525b; }
  body { background: #fff; color: #000; } .finding, tr { break-inside: avoid; } .skip { display: none; }
  pre { white-space: pre-wrap; overflow: visible; }
}
@media (forced-colors: active) {
  .box, .halo { stroke: CanvasText; } .tag { fill: CanvasText; stroke: Canvas; }
  .chip, .finding, pre, table, th, td { border-color: CanvasText; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#findings">Skip to findings</a> <a class="skip" href="#coverage-region">Skip to coverage</a>
<header>
  <h1>WCAG 2.2 audit</h1>
  <p><span class="mono">$url</span></p>
  <p class="meta"><span class="chip">Condition: $condition</span> <span class="chip">Viewport: $viewport</span> <span class="chip">$total findings</span></p>
</header>
<main id="main" tabindex="-1">
  <section aria-labelledby="summary-h"><h2 id="summary-h">Summary</h2>
    <ul class="summary" role="list">$summary</ul>
    $overview
  </section>
  <section aria-labelledby="coverage-h"><h2 id="coverage-h">Coverage</h2><div class="scroll" id="coverage-region" role="region" aria-label="Coverage table" tabindex="0">$coverage</div></section>
  <nav aria-label="Criteria with findings"><h2>Criteria</h2><ul>$nav</ul></nav>
  <div id="findings" tabindex="-1">$empty$findings</div>
</main>
<footer><p class="mono">$versions</p></footer>
</body>
</html>
