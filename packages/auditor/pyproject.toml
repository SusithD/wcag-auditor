[project]
name = "auditor"
version = "0.1.0"
description = "ML-assisted WCAG 2.2 auditor for web UI screenshots"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "typer>=0.12",
  "rich",
  "playwright==1.63.0",
  "pillow>=12",
  "numpy",
  "scipy>=1.18.1",
  "statsmodels>=0.15.0",
  "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
auditor = "auditor.cli:app"

[project.optional-dependencies]
ml = [
    "albumentations>=2.0.8",
    "imagehash>=4.3.2",
    "onnx>=1.23.2",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "rfdetr[loggers,train]>=1.11.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditor"]
