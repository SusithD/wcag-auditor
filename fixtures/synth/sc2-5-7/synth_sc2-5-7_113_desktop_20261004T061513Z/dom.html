<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragging alternative</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { width: 1440px; min-height: 900px; position: relative; background: #FFFFFF; color: #111; }
  header.site {
    position: absolute; top: 0; left: 0; width: 100%;
    height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB;
    padding: 20px 32px; z-index: 10;
    font-weight: 600; color: #1F2937;
  }
  main.content { position: relative; padding: 96px 48px 48px 48px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB;
    border-radius: 8px; padding: 24px; margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px 0; font-size: 24px; color: #111827; }
  p  { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; color: #1F2937; }
  
</style>
</head>
<body>
<header class="site">Synthetic Test Corpus — page synth_2.5.7_003</header>
<main class="content">

    <div class="card" style="background:#FFFFFF;">
      <h1>Adjust price range</h1>
      <p>Drag the handle or use the alternative controls.</p>
      
        <div data-test-el="e-1" style="position:absolute; left:120px; top:260px; width:480px; height:48px;">
          <div style="height:6px; background:#E5E7EB; border-radius:3px; position:relative; top:20px;">
            <div style="position:absolute; left:180px; top:-8px;
                        width:22px; height:22px; background:#0B57D0;
                        border-radius:50%; cursor:grab;" role="slider" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
        
    </div>
    
</main>


</body></html>
