<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus obscured</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { width: 1440px; min-height: 900px; position: relative; background: #FFFFFF; color: #111; }
  header.site {
    position: absolute; top: 0; left: 0; width: 100%;
    height: 64px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB;
    padding: 20px 32px; z-index: 10;
    font-weight: 600; color: #1F2937;
  }
  main.content { position: relative; padding: 96px 48px 48px 48px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB;
    border-radius: 8px; padding: 24px; margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px 0; font-size: 24px; color: #111827; }
  p  { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; color: #1F2937; }
  header.site { position: fixed; } #email:focus { outline: 3px solid #0B57D0; outline-offset: 2px; }
</style>
</head>
<body>
<header class="site">Synthetic Test Corpus — page synth_2.4.12_001</header>
<main class="content">

    <input id="email" type="email" autofocus="" placeholder="you@example.com" data-test-el="e-1" style="position: absolute; left: 120px; top: 44px; width: 480px; height: 40px; border: 2px solid rgb(11, 87, 208); border-radius: 6px; background: rgb(255, 255, 255); padding: 8px; font-size: 14px;">
    <div class="card" style="background:#FFFFFF;">
      <h1>Newsletter signup</h1>
      <p>Enter your email to receive weekly updates.</p>
    </div>
    
</main>


</body></html>
